<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ritual Experience</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(#0d0d0d, #1a1a1a);
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 2.5rem;
      color: #e0c96d;
      animation: pulse 3s infinite;
    }
    p {
      max-width: 600px;
      margin: 2rem auto;
      font-size: 1.2rem;
    }
    @keyframes pulse {
      0% { text-shadow: 0 0 10px #e0c96d; }
      50% { text-shadow: 0 0 30px #e0c96d; }
      100% { text-shadow: 0 0 10px #e0c96d; }
    }
    .botao {
      background-color: #e0c96d;
      color: #1a1a1a;
      padding: 1rem 2rem;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .botao:hover {
      background-color: #fff;
    }
  </style>
</head>
<body>
  <h1>Olhos do Infinito</h1>
  <p>Desperte a conexão cósmica através dessa experiência ritual. Toque, veja e sinta a vibração da nova era do Versos Líricos.</p>
  <button class="botao" onclick="alert('Portais abertos!')">Iniciar Ritual</button>
</body>
</html>
